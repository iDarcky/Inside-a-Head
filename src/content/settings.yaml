manifestoTitle: Ideas are messy.
manifesto: |-
  This is not a portfolio. A portfolio is static. This is an active studio, a living organism where idealism meets execution.

  We embrace the tension between the structured architecture of a design system and the chaotic beauty of raw creativity. Behind every pristine user interface is a Museum of my Mess: abandoned hobbies, wild ideas, and the vulnerable human side of creation.

  There is always a way to succeed. But you have to start building.
